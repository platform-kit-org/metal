# promtool unit tests for config/prometheus/rules.yaml. promtool reads a plain
# rule file, not a PrometheusRule, so `mise run metrics:rules` copies the
# rule file's spec next to this file as rules.yaml before it runs:
#
#   promtool test rules rules_test.yaml
#
# Test time starts at the Unix epoch, so time() is the seconds since the
# start of the test.
rule_files:
  - rules.yaml
evaluation_interval: 1m

tests:
  # A daily policy: a snapshot 25 hours old is on time, one 49 hours old is
  # two missed snapshots. A fixed 12-hour threshold paged every afternoon.
  - interval: 1m
    input_series:
      - series: 'pk_metal_etcd_backup_interval_seconds{cluster="c"}'
        values: '86400x3000'
      - series: 'pk_metal_etcd_backup_last_success_timestamp_seconds{cluster="c"}'
        values: '0x3000'
    alert_rule_test:
      - eval_time: 25h
        alertname: PkMetalEtcdBackupStale
        exp_alerts: []
      - eval_time: 49h
        alertname: PkMetalEtcdBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              cluster: c
            exp_annotations:
              summary: "The newest verified etcd backup of cluster c is older than twice its backup interval"
              description: "Without a recent backup a lost quorum loses recent cluster state. kubectl get etcdbackuppolicy and kubectl get etcdsnapshot -l os.platform-kit.org/cluster=c show why."
              runbook_url: https://metal.platform-kit.org/operate/runbooks/backup-failing/
      - eval_time: 49h
        alertname: PkMetalEtcdBackupMissing
        exp_alerts: []

  # A policy without any verified snapshot.
  - interval: 1m
    input_series:
      - series: 'pk_metal_etcd_backup_interval_seconds{cluster="new"}'
        values: '21600x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: PkMetalEtcdBackupMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              cluster: new
            exp_annotations:
              summary: "Cluster new has a backup policy but no verified etcd snapshot"
              description: "kubectl describe etcdbackuppolicy shows why no snapshot was taken, stored or verified."
              runbook_url: https://metal.platform-kit.org/operate/runbooks/backup-failing/

  # A node still being installed is not Ready and pages nobody; a node of
  # the running cluster that answered before does.
  - interval: 1m
    input_series:
      - series: 'pk_metal_talosnode_ready{cluster="c",node="w-1",role="worker"}'
        values: '0x40'
      - series: 'pk_metal_talosnode_expected_ready{cluster="c",node="w-1",role="worker"}'
        values: '1x40'
      - series: 'pk_metal_talosnode_ready{cluster="c",node="w-2",role="worker"}'
        values: '0x40'
      - series: 'pk_metal_talosnode_expected_ready{cluster="c",node="w-2",role="worker"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PkMetalNodeNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              cluster: c
              node: w-1
              role: worker
            exp_annotations:
              summary: "TalosNode w-1 (worker) in cluster c is not Ready"
              description: "pk-metal status shows the node table; kubectl describe talosnode w-1 shows why."
              runbook_url: https://metal.platform-kit.org/operate/runbooks/node-not-ready/

  # A cluster that is not yet bootstrapped is being built, not down.
  - interval: 1m
    input_series:
      - series: 'pk_metal_taloscluster_available{cluster="new"}'
        values: '0x40'
      - series: 'pk_metal_taloscluster_expected_available{cluster="new"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PkMetalClusterUnavailable
        exp_alerts: []

  # The dead man's switch: the manager stops answering at minute 11.
  - interval: 1m
    input_series:
      - series: 'up{job="pk-metal-metrics",namespace="pk-metal"}'
        values: '1x10 0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: PkMetalMetricsAbsent
        exp_alerts: []
      - eval_time: 25m
        alertname: PkMetalMetricsAbsent
        exp_alerts:
          # absent() of a comparison carries no labels of the series.
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Prometheus has not scraped the pk-metal manager for 10 minutes"
              description: "No pk-metal alert can fire while this one does. kubectl -n pk-metal get pods,endpoints shows whether the manager runs; if the API server does not answer, the management cluster is lost."
              runbook_url: https://metal.platform-kit.org/operate/runbooks/management-cluster-lost/

  # A rollout that waits for health for more than an hour; one a person
  # paused is left alone.
  - interval: 1m
    input_series:
      - series: 'pk_metal_rollout_condition{rollout="upgrade",cluster="c",reason="WaitingForHealth"}'
        values: '1x90'
      - series: 'pk_metal_rollout_condition{rollout="held",cluster="c",reason="PausedByPerson"}'
        values: '1x90'
    alert_rule_test:
      - eval_time: 30m
        alertname: PkMetalRolloutStalled
        exp_alerts: []
      - eval_time: 70m
        alertname: PkMetalRolloutStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              rollout: upgrade
              cluster: c
              reason: WaitingForHealth
            exp_annotations:
              summary: "TalosRollout upgrade of cluster c has not moved for an hour: WaitingForHealth"
              description: "pk-metal status shows the ROLLOUT table; kubectl describe talosrollout upgrade says what it waits for."
              runbook_url: https://metal.platform-kit.org/operate/runbooks/rollout-paused/

  # Waiting for a maintenance window is the plan working; the cluster guard
  # holding an approved operation for an hour is not.
  - interval: 1m
    input_series:
      - series: 'pk_metal_operation_blocked{namespace="pk-metal",operation="a",host="n1",reason="OutsideMaintenanceWindow"}'
        values: '1x90'
      - series: 'pk_metal_operation_blocked{namespace="pk-metal",operation="b",host="n2",reason="ClusterDisruption"}'
        values: '1x90'
    alert_rule_test:
      - eval_time: 70m
        alertname: PkMetalOperationBlocked
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: pk-metal
              operation: b
              host: n2
              reason: ClusterDisruption
            exp_annotations:
              summary: "Approved HostOperation pk-metal/b on n2 has not started for an hour: ClusterDisruption"
              description: "kubectl describe hostoperation -n pk-metal b says what holds it and what to run."
              runbook_url: https://metal.platform-kit.org/operate/runbooks/operation-held/

  # A gate policy that goes missing pages after two minutes; one that is
  # back resolves.
  - interval: 1m
    input_series:
      - series: 'pk_metal_admission_gate_degraded{policy="guard-lift"}'
        values: '0 1 1 1 1 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: PkMetalAdmissionGateDegraded
        exp_alerts: []
      - eval_time: 4m
        alertname: PkMetalAdmissionGateDegraded
        exp_alerts:
          - exp_labels:
              severity: critical
              policy: guard-lift
            exp_annotations:
              summary: "The admission policy guard-lift of the approval gate is missing or does not deny"
              description: "kubectl get validatingadmissionpolicy,validatingadmissionpolicybinding guard-lift shows what is wrong; the gate.degraded line of the operator audit log says it in words. Apply the site overlay again."
              runbook_url: https://metal.platform-kit.org/operate/runbooks/admission-gate-degraded/
      - eval_time: 6m
        alertname: PkMetalAdmissionGateDegraded
        exp_alerts: []

  # A controller whose passes fail ten times for two successes pages after
  # the 15-minute rate and the 30-minute hold; one with one failure in ten
  # does not.
  - interval: 1m
    input_series:
      - series: 'controller_runtime_reconcile_total{job="pk-metal-metrics", namespace="pk-metal", controller="hostclaim", result="error"}'
        values: '0+10x120'
      - series: 'controller_runtime_reconcile_total{job="pk-metal-metrics", namespace="pk-metal", controller="hostclaim", result="success"}'
        values: '0+2x120'
      - series: 'controller_runtime_reconcile_total{job="pk-metal-metrics", namespace="pk-metal", controller="host", result="error"}'
        values: '0+1x120'
      - series: 'controller_runtime_reconcile_total{job="pk-metal-metrics", namespace="pk-metal", controller="host", result="success"}'
        values: '0+9x120'
      - series: 'controller_runtime_reconcile_total{job="other-operator", namespace="other", controller="widget", result="error"}'
        values: '0+10x120'
    alert_rule_test:
      - eval_time: 20m
        alertname: PkMetalReconcileFailing
        exp_alerts: []
      - eval_time: 50m
        alertname: PkMetalReconcileFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              controller: hostclaim
            exp_annotations:
              summary: "More than half of the passes of controller hostclaim fail"
              description: "kubectl -n pk-metal logs deploy/pk-metal-manager --since=1h | grep 'Reconciler error' | grep '\"controller\":\"hostclaim\"' shows the error."
              runbook_url: https://metal.platform-kit.org/operate/runbooks/reconcile-failing/

  # One recovered panic pages at once, and resolves an hour later.
  - interval: 1m
    input_series:
      - series: 'controller_runtime_reconcile_panics_total{job="pk-metal-metrics", namespace="pk-metal", controller="host"}'
        values: '0 0 0 1x120'
    alert_rule_test:
      - eval_time: 2m
        alertname: PkMetalReconcilePanicked
        exp_alerts: []
      - eval_time: 10m
        alertname: PkMetalReconcilePanicked
        exp_alerts:
          - exp_labels:
              severity: warning
              controller: host
            exp_annotations:
              summary: "Controller host panicked in the last hour"
              description: "The manager log has the stack: kubectl -n pk-metal logs deploy/pk-metal-manager --since=1h | grep -A40 'Observed a panic'."
              runbook_url: https://metal.platform-kit.org/operate/runbooks/reconcile-failing/
      - eval_time: 90m
        alertname: PkMetalReconcilePanicked
        exp_alerts: []

  # Four of four workers busy for an hour is a note; three of four is not.
  - interval: 1m
    input_series:
      - series: 'controller_runtime_active_workers{job="pk-metal-metrics", namespace="pk-metal", controller="hostoperation"}'
        values: '4x70 3x70'
      - series: 'controller_runtime_max_concurrent_reconciles{job="pk-metal-metrics", namespace="pk-metal", controller="hostoperation"}'
        values: '4x140'
    alert_rule_test:
      - eval_time: 30m
        alertname: PkMetalOperationWorkersBusy
        exp_alerts: []
      - eval_time: 65m
        alertname: PkMetalOperationWorkersBusy
        exp_alerts:
          - exp_labels:
              severity: info
            exp_annotations:
              summary: "Every HostOperation worker has been busy for an hour"
              description: "Approved operations of other hosts wait for a free worker. For a planned change of many hosts, wait. Otherwise raise --operation-workers of the manager."
              runbook_url: https://metal.platform-kit.org/operate/runbooks/workers-busy/
      - eval_time: 100m
        alertname: PkMetalOperationWorkersBusy
        exp_alerts: []
