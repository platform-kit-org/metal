# One machine as the organization asserts it: what it was bought as, and how to
# reach the controller that fronts it. Nothing here is discovered — the serial and
# MAC are checked against what the machine reports, and a disagreement holds rather
# than resolving itself. Real Assets are authored in git; this one exists so a dev
# cluster has something to apply.
apiVersion: metal.platform-kit.org/v1alpha1
kind: Asset
metadata:
  name: asset-07
spec:
  cid: "ASSET-07"
  serial: "SIMHW2288V5000397"
  bmcMac: "0c:c4:7a:12:34:56"
  vlan: 100
  credentialsRef:
    name: ibmc-factory
