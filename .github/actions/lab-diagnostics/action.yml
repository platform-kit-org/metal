# The diagnostics directory holds object dumps without Secret contents, the
# operator's and the fleet's logs and the machines' consoles. The secrets
# bundle, the kubeconfigs and the disks are not in it.
name: lab-diagnostics
description: Collect the virtual lab's diagnostics and upload them as an artifact
inputs:
  name:
    description: The name of the artifact
    required: true
runs:
  using: composite
  steps:
    - name: Collect diagnostics
      shell: bash
      run: mise run lab:collect
    # Also when the collection failed: the files it wrote are still evidence.
    - name: Upload diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: .lab/diagnostics
        if-no-files-found: warn
        retention-days: 7
