# golangci-lint v2 with its standard linter set. The two exclusion presets drop
# the findings that the Go community does not treat as defects: unchecked
# Close on a read path and unchecked fmt.Fprint* to a writer.
version: "2"
linters:
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
# golangci-lint run also reports a file that the formatters would change, so
# CI fails on it; golangci-lint fmt rewrites the files.
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dennisklein/platform-kit
