\* The phase derivation before the fix of the release race ("cache"): the
\* Host was Releasing only while the cached claim existed and was being
\* deleted, and the OS ladder did not need a claim. hack/tlc.sh requires
\* TLC to find ReleasedHostNeverProvisioned violated here: the property
\* catches the race the lab showed.
CONSTANTS
    Claims = {a, b}
    MaxGen = 1
    MaxLag = 2
    Rule = "cache"
    Nil = Nil
SYMMETRY Symmetry
CONSTRAINT LagBound
SPECIFICATION Spec
PROPERTIES ReleasedHostNeverProvisioned
