# The site settings. The admission policies read them from this ConfigMap,
# together with the operator's identity (config/policy).
#
# adminGroup is the admin group. Keep it equal to the group of the
# pk-metal-admin bindings in bindings.yaml. Set it before the first apply: a
# later change needs a member of the old group (settings-guard).
#
# selfApproval says whether a person may approve an operation or a rollout
# that they proposed themselves.
#
#   Allowed    one person can propose and approve. The record still names
#              them twice, and the operator still approves nothing. For a
#              team too small for two-person review. The default.
#   Forbidden  another person must approve, so one account alone cannot
#              change a machine.
#
# Any other value counts as Forbidden.
#
# retention is how long the operator keeps a finished operation or rollout
# that it may delete (the operator reads this key, admission does not):
#
#   30d        a number of days, or a duration such as 720h. The default.
#   Forever    nothing finished is deleted; a person deletes old records.
#
# A value the operator cannot read keeps every record.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hostoperation-approval
  namespace: pk-metal
data:
  adminGroup: pk-metal:admins
  selfApproval: Allowed
  retention: 30d
