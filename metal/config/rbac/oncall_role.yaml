# What a person on call needs to follow the runbooks (docs site:
# operate/runbooks), and no more. The runbooks read every pk-metal kind, and
# they change a few things that start no machine change by themselves:
#   - delete a failed or aborted HostOperation (pk-metal retry); the operator
#     proposes a new one, which waits for approval again;
#   - patch a HostClaim (pk-metal hold, unhold) and a Host (pk-metal wipe, or
#     remove the disk-not-wiped mark); a wipe is still an operation that a
#     person approves. This patch can also set the guard lifts there
#     (allow-self-disruption, wipe-waived, ack-etcd-risk); guard-lift
#     admission makes each one name that person;
#   - patch a TalosCluster to remove the restore-pending mark after a restore;
#   - patch an Asset to correct its ledger facts;
#   - delete a TalosRollout to stop it for good.
# It may also read the manager's /metrics (the manager asks the API server
# whether a caller may get that URL), for a look when Prometheus is down,
# and the admission policies, to find the one PkMetalAdmissionGateDegraded
# names. The Role below reads the manager's pod, log and Deployment, and the
# imager Jobs, in pk-metal only: the runbooks read the manager log.
# It holds no patch on HostOperations or TalosRollouts: that is approval, and
# belongs to pk-metal-approver. Bind both to a person who must also approve,
# abort, or resume. It holds no Secret. The base binds nothing; the sample
# site overlay binds the ClusterRole and the Role to one group
# (config/samples/site-overlay/bindings.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pk-metal-oncall
rules:
  - apiGroups: ["metal.platform-kit.org"]
    resources: ["hostoperations"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["metal.platform-kit.org"]
    resources: ["hostclaims", "hosts", "assets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["metal.platform-kit.org"]
    resources: ["managementendpoints", "endpointprofiles", "maintenancewindows",
      "biosprofiles", "biosschemas", "biossettings", "firmwareprofiles"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["os.platform-kit.org"]
    resources: ["talosrollouts"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["os.platform-kit.org"]
    resources: ["talosclusters"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["os.platform-kit.org"]
    resources: ["talosnodes", "bootassets", "etcdbackuppolicies", "etcdsnapshots"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings",
      "mutatingadmissionpolicies", "mutatingadmissionpolicybindings"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pk-metal-oncall
  namespace: pk-metal
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
