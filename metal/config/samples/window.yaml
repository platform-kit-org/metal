# A maintenance window: when approved operations on the selected machines can
# start. Without a window that selects a machine, an approved operation starts
# at once. A window does not replace the approval.
apiVersion: metal.platform-kit.org/v1alpha1
kind: MaintenanceWindow
metadata:
  name: workers-weekend
spec:
  # The Hosts that carry this label. A claim copies its spec.labels to its
  # Host. Add clusters: to also cover each node of a cluster: either match is
  # enough.
  hostSelector:
    matchLabels:
      role: worker
  timeZone: Europe/Berlin
  weekly:
    - days: [Sat]
      start: "22:00"
      duration: 6h
